# Manual weekend boarding preview (arrivals + departures for Fri–Sun).
# The on-time Friday 3pm send is a Vercel cron (REQ-659), with a 4pm retry; /api/notify picks it
# from the Pacific hour, so DST needs no edits. This workflow has no schedule; run it by hand to re-send.
name: Notify Friday PM (manual)

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send weekend boarding preview
        run: |
          RESPONSE=$(curl -s -o /tmp/notify_response.json -w "%{http_code}" \
            "${{ secrets.APP_URL }}/api/notify?window=friday-pm&token=${{ secrets.INTERNAL_API_TOKEN }}")
          echo "HTTP status: $RESPONSE"
          cat /tmp/notify_response.json
          if [ "$RESPONSE" != "200" ]; then
            echo "Notify endpoint returned non-200 status"
            exit 1
          fi
