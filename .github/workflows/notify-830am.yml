# Manual 8:30am re-check: sends only if the roster changed since the last send.
# The on-time 8:30am check is a Vercel cron (REQ-659; it lands 8:00–8:59 Pacific). This workflow
# has no schedule; run it by hand to re-check.
name: Notify 8:30am (manual)

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send roster image if updated
        run: |
          RESPONSE=$(curl -s -o /tmp/notify_response.json -w "%{http_code}" \
            "${{ secrets.APP_URL }}/api/notify?window=8:30am&token=${{ secrets.INTERNAL_API_TOKEN }}")
          echo "HTTP status: $RESPONSE"
          cat /tmp/notify_response.json
          if [ "$RESPONSE" != "200" ]; then
            echo "Notify endpoint returned non-200 status"
            exit 1
          fi
