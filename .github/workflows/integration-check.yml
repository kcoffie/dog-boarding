# Integration check — scrapes the AGYD schedule via real browser (Playwright),
# compares against DB, sends the report to Kate (Telegram, REQ-652).
#
# Step 0 runs schedule sync + drains detail queue before the Playwright compare,
# so bookings made after midnight UTC but before this check don't appear as false
# positives. Non-fatal — if sync fails, the check continues with current DB state.
#
# Runs 3x/day. Also available on-demand via workflow_dispatch.
#
# DST note: Pacific Daylight Time = UTC-7 (Mar–Nov), Standard = UTC-8 (Nov–Mar).
#           Update cron times each March and November DST transition.
#
# Required Repository secrets (Settings → Secrets → Actions → Repository secrets):
#   VITE_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   EXTERNAL_SITE_USERNAME, EXTERNAL_SITE_PASSWORD  ← Step 0 re-auth on session expiry
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID (Kate's alert channel, REQ-652)
name: Integration Check

on:
  workflow_dispatch:
  schedule:
    # 1:00 AM PDT (08:00 UTC) — shortly after midnight cron finishes
    - cron: '0 8 * * *'
    # 9:00 AM PDT (16:00 UTC)
    - cron: '0 16 * * *'
    # 5:00 PM PDT (00:00 UTC next day)
    - cron: '0 0 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run integration check
        run: node scripts/integration-check.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXTERNAL_SITE_USERNAME: ${{ secrets.EXTERNAL_SITE_USERNAME }}
          EXTERNAL_SITE_PASSWORD: ${{ secrets.EXTERNAL_SITE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          INTEGRATION_CHECK_SCHEDULE: ${{ github.event.schedule }}
